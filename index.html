    // --- CAROUSEL BANNER COMPONENT ---
    function BannerCarousel({ banners }) {
      const [current, setCurrent] = useState(0);

      useEffect(() => {
        if (!banners || banners.length <= 1) return;
        const timer = setInterval(() => {
          setCurrent(prev => (prev + 1) % banners.length);
        }, 5500);
        return () => clearInterval(timer);
      }, [banners]);

      if (!banners || banners.length === 0) return null;

      const nextSlide = () => setCurrent(prev => (prev + 1) % banners.length);
      const prevSlide = () => setCurrent(prev => (prev - 1 + banners.length) % banners.length);

      return (
        <section className="relative overflow-hidden w-full select-none bg-stone-900 border-b border-stone-200">
          <div className="w-full relative">
            {banners.map((item, idx) => (
              <div
                key={item.id || idx}
                className={`transition-opacity duration-700 ease-in-out ${idx === current ? "opacity-100 relative" : "opacity-0 absolute inset-0 pointer-events-none"}`}
              >
                {/* Mobile Screen Banner */}
                <div className="block sm:hidden w-full">
                  <img 
                    src={item.mobileUrl || item.desktopUrl} 
                    alt="Lotus Jewellery Collection" 
                    className="w-full h-auto object-cover block jewellery-img-render"
                  />
                </div>

                {/* Laptop / Desktop Screen Banner */}
                <div className="hidden sm:block w-full">
                  <img 
                    src={item.desktopUrl} 
                    alt="Lotus Jewellery Collection" 
                    className="w-full h-auto max-h-[580px] object-cover block jewellery-img-render"
                  />
                </div>
              </div>
            ))}
          </div>

          {banners.length > 1 && (
            <button
              onClick={prevSlide}
              aria-label="Previous Slide"
              className="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center transition backdrop-blur-md z-20 text-lg sm:text-2xl shadow"
            >
              &#10094;
            </button>
          )}

          {banners.length > 1 && (
            <button
              onClick={nextSlide}
              aria-label="Next Slide"
              className="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center transition backdrop-blur-md z-20 text-lg sm:text-2xl shadow"
            >
              &#10095;
            </button>
          )}

          {banners.length > 1 && (
            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-20">
              {banners.map((_, i) => (
                <button
                  key={i}
                  onClick={() => setCurrent(i)}
                  className={`h-2 rounded-full transition-all ${i === current ? "w-6 bg-[#99793d]" : "w-2 bg-white/70 hover:bg-white"}`}
                />
              ))}
            </div>
          )}
        </section>
      );
    }

    // --- DETAILED PRODUCT VIEW (TAP TO ZOOM) ---
    function ProductDetailView({ product, onBack }) {
      const [isZoomed, setIsZoomed] = useState(false);
      const [mousePos, setMousePos] = useState({ x: 50, y: 50 });

      const handleMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = ((clientX - rect.left) / rect.width) * 100;
        const y = ((clientY - rect.top) / rect.height) * 100;
        setMousePos({ x, y });
      };

      return (
        <main className="max-w-5xl mx-auto px-4 py-4 sm:py-8">
          <button 
            onClick={onBack}
            className="inline-flex items-center gap-1.5 text-xs uppercase tracking-wider font-bold text-stone-700 hover:text-[#5a0017] mb-4 bg-white border border-stone-300 px-3.5 py-1.5 rounded-full shadow-sm"

            <div 
              className="relative w-full aspect-square bg-[#faf8f5] overflow-hidden cursor-crosshair flex items-center justify-center"
              onClick={() => setIsZoomed(!isZoomed)}
              onMouseEnter={() => setIsZoomed(true)}
              onMouseLeave={() => setIsZoomed(false)}
              onMouseMove={handleMove}
              onTouchMove={handleMove}

              <img 
                src={product.image}

      const handleLogin = (e) => {
        e.preventDefault();
        if (enteredPin === OWNER_PIN) {
          setIsAuthenticated(true);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setImagePreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleDeskUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewDeskUrl(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleMobUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setNewMobUrl(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAddBanner = (e) => {
        e.preventDefault();
        if (!newDeskUrl && !newMobUrl) {
          alert("Please provide at least one banner image!");
          return;
        }
        const newSlide = {
          id: Date.now(),
          desktopUrl: newDeskUrl || newMobUrl,
          mobileUrl: newMobUrl || newDeskUrl
        };
        const updated = [...banners, newSlide];
        setBanners(updated);
        localStorage.setItem("lotus_banners", JSON.stringify(updated));
        setNewDeskUrl("");
        setNewMobUrl("");
        alert("✨ New banner slide added!");
      };

        if (banners.length <= 1) {
          alert("Keep at least 1 banner slide.");
          return;
        }
        if (confirm("Remove this banner slide?")) {
          const updated = banners.filter(b => b.id !== id);
          setBanners(updated);
          localStorage.setItem("lotus_banners", JSON.stringify(updated));
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!name || !price || !imagePreview) {
          alert("Please provide the Product Name, Price, and an Image!");
          return;
        }

        const newProduct = {
          id: Date.now(),
          name,
          price: Number(price),
          originalPrice: originalPrice ? Number(originalPrice) : null,
          category,
          tag,
          description: description || "Handcrafted luxury 1-gram gold jewellery.",
          image: imagePreview

        const updated = [newProduct, ...products];
        setProducts(updated);
        localStorage.setItem("lotus_products", JSON.stringify(updated));

        setPrice("");
        setOriginalPrice("");
        setDescription("");
        setImagePreview("");

      };

      const handleDeleteProduct = (id) => {
        if (confirm("Remove this item?")) {
          const updated = products.filter(p => p.id !== id);
          setProducts(updated);
          localStorage.setItem("lotus_products", JSON.stringify(updated));
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-center items-center p-3 sm:p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[92vh] overflow-y-auto p-5 sm:p-7">
            <div className="flex justify-between items-center border-b pb-3 mb-4">
              <h2 className="text-base sm:text-lg font-bold font-serif text-[#5a0017]">Owner Portal</h2>
              <button onClick={onClose} className="bg-stone-100 text-stone-800 px-3 py-1 rounded-full text-xs font-bold">
                ✕ Close
              </button>
            </div>

            {!isAuthenticated ? (
              <form onSubmit={handleLogin} className="max-w-xs mx-auto py-6 text-center">
                <div className="w-10 h-10 bg-amber-100 text-amber-900 rounded-full flex items-center justify-center mx-auto mb-3 text-lg font-bold">
                  🔒
                </div>
                <h3 className="font-serif text-base font-bold text-stone-800 mb-1">Enter Passcode</h3>
                <input 
                  type="password"
                  placeholder="••••••••"
                  value={enteredPin}
                  onChange={(e) => setEnteredPin(e.target.value)}
                  className="w-full text-center tracking-widest text-lg font-bold p-2.5 border rounded-lg outline-none focus:border-[#5a0017] mb-3"
                  autoFocus
                />
                {pinError && <p className="text-xs text-red-600 mb-2">Incorrect passcode.</p>}
                <button type="submit" className="w-full bg-[#5a0017] text-white py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider">
                  Unlock
                </button>
              </form>
            ) : (
              <div>
                <div className="flex border-b border-stone-200 mb-4 gap-4 text-xs font-bold uppercase tracking-wider">
                  <button 
                    onClick={() => setActiveTab("products")}
                    className={`pb-2 border-b-2 ${activeTab === 'products' ? 'border-[#5a0017] text-[#5a0017]' : 'border-transparent text-stone-500'}`}
                  >
                    💎 Products ({products.length})
                  </button>
                  <button 
                    onClick={() => setActiveTab("banner")}
                    className={`pb-2 border-b-2 ${activeTab === 'banner' ? 'border-[#5a0017] text-[#5a0017]' : 'border-transparent text-stone-500'}`}
                  >
                    🎬 Banner Slides ({banners.length})
                  </button>
                </div>

                {activeTab === "products" ? (
                  <div>
                    <form onSubmit={handleAddProduct} className="space-y-3 bg-[#faf8f5] p-4 rounded-xl border border-stone-200 text-xs">
                      <div>
                        <label className="font-bold text-stone-700 block mb-1">Name</label>
                        <input 
                          type="text" 
                          value={name} 
                          onChange={e => setName(e.target.value)}
                          className="w-full bg-white border rounded p-2 text-xs" 
                          placeholder="e.g. Royal Kundan Haar"
                          required
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="font-bold text-stone-700 block mb-1">Price (₹)</label>
                          <input 
                            type="number" 
                            value={price} 
                            onChange={e => setPrice(e.target.value)}
                            className="w-full bg-white border rounded p-2 text-xs" 
                            required
                          />
                        </div>
                        <div>
                          <label className="font-bold text-stone-700 block mb-1">Category</label>
                          <select 
                            value={category} 
                            onChange={e => setCategory(e.target.value)}
                            className="w-full bg-white border rounded p-2 text-xs"
                          >
                            <option value="Bridal">Bridal</option>
                            <option value="Necklaces">Necklaces</option>
                            <option value="Bangles">Bangles</option>
                            <option value="Earrings">Earrings</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="font-bold text-stone-700 block mb-1">Photo</label>
                        <input 
                          type="file" 
                          accept="image/*"
                          onChange={handleImageUpload}
                          className="w-full bg-white border rounded p-2 text-xs" 
                        />
                        {imagePreview && <img src={imagePreview} className="w-12 h-12 object-cover rounded mt-2 border" />}
                      </div>
                      <button type="submit" className="w-full bg-[#5a0017] text-white font-bold py-2.5 rounded text-xs uppercase tracking-wider mt-2">
                        + Add Jewellery Item
                      </button>
                    </form>

                    <div className="mt-4">
                      <h4 className="text-xs font-bold uppercase mb-2">Live Items ({products.length})</h4>
                      <div className="max-h-52 overflow-y-auto space-y-1.5">
                        {products.map(p => (
                          <div key={p.id} className="flex items-center justify-between bg-stone-50 border p-2 rounded text-xs">
                            <div className="flex items-center gap-2 truncate">
                              <img src={p.image} className="w-8 h-8 object-cover rounded shrink-0 jewellery-img-render" />
                              <span className="truncate">{p.name} - {formatPrice(p.price)}</span>
                            </div>
                            <button onClick={() => handleDeleteProduct(p.id)} className="text-red-600 font-bold ml-2">
                              Delete
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div>
                    <form onSubmit={handleAddBanner} className="space-y-3 bg-[#faf8f5] p-4 rounded-xl border border-stone-200 text-xs mb-4">
                      <h4 className="font-bold text-[#5a0017] uppercase">Add New Banner Slide</h4>
                      <div>
                        <label className="font-bold text-stone-700 block mb-1">Laptop / Desktop Banner (1920×600 px)</label>
                        <input 
                          type="text" 
                          placeholder="Image URL or local file path" 
                          value={newDeskUrl.startsWith("data:") ? "" : newDeskUrl} 
                          onChange={e => setNewDeskUrl(e.target.value)}
                          className="w-full bg-white border rounded p-2 text-xs mb-1"
                        />
                        <input type="file" accept="image/*" onChange={handleDeskUpload} className="w-full text-xs" />
                      </div>

                      <div>
                        <label className="font-bold text-stone-700 block mb-1">Mobile Banner (1080×1080 or 1080×1350 px)</label>
                        <input 
                          type="text" 
                          placeholder="Image URL or local file path" 
                          value={newMobUrl.startsWith("data:") ? "" : newMobUrl} 
                          onChange={e => setNewMobUrl(e.target.value)}
                          className="w-full bg-white border rounded p-2 text-xs mb-1"
                        />
                        <input type="file" accept="image/*" onChange={handleMobUpload} className="w-full text-xs" />
                      </div>

                      <button type="submit" className="w-full bg-[#5a0017] text-white font-bold py-2 rounded text-xs uppercase tracking-wider">
                        + Add Banner Slide
                      </button>
                    </form>

                    <h4 className="text-xs font-bold uppercase mb-2">Existing Slides ({banners.length})</h4>
                    <div className="space-y-2 max-h-56 overflow-y-auto">
                      {banners.map((b, idx) => (
                        <div key={b.id || idx} className="flex items-center justify-between p-2.5 bg-stone-50 border rounded text-xs">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-stone-500">#{idx + 1}</span>
                            <img src={b.mobileUrl || b.desktopUrl} className="w-10 h-10 object-cover rounded border jewellery-img-render" />
                            <span className="text-[11px] text-stone-600">Slide {idx + 1}</span>
                          </div>
                          <button onClick={() => handleDeleteBanner(b.id)} className="text-red-600 font-bold hover:underline">
                            Delete
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("lotus_products");
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [banners, setBanners] = useState(() => {
        const saved = localStorage.getItem("lotus_banners");
        return saved ? JSON.parse(saved) : DEFAULT_BANNERS;
      });

      const [selectedCat, setSelectedCat] = useState("All");
      const [activeProduct, setActiveProduct] = useState(null);
      const [showOwnerPortal, setShowOwnerPortal] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'l') {
            setShowOwnerPortal(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const filtered = useMemo(() => {
        return products.filter(p => selectedCat === "All" || p.category.toLowerCase() === selectedCat.toLowerCase());
      }, [selectedCat, products]);

      const handleSelectCategory = (catName) => {
        setSelectedCat(catName);
        if (activeProduct) setActiveProduct(null);
        setTimeout(() => {
          const el = document.getElementById('catalogue');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 30);
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Top Announcement Bar */}
          <div className="bg-[#5a0017] text-[#f7e6b5] text-[10px] sm:text-xs py-1.5 px-3 text-center tracking-wider flex justify-between items-center">
            <span className="truncate">✨ Lotus Collection | Luxury 1 Gram Gold & Bridal Jewellery</span>
            <a href="tel:7996957565" className="font-semibold underline ml-2 shrink-0">Direct: 7996957565</a>
          </div>

          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-stone-200">
            <div className="max-w-6xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between">
              
              <div 
                className="flex items-center gap-2 cursor-pointer shrink-0" 
                onClick={() => { setActiveProduct(null); setSelectedCat("All"); window.scrollTo({top: 0, behavior: 'smooth'}); }}
              >
                <img src={LOGO_URL} alt="Lotus Collection" className="h-9 sm:h-11 w-auto object-contain" />
                <div>
                  <h1 className="text-base sm:text-xl font-serif font-bold text-[#5a0017] tracking-wider uppercase leading-none">
                    Lotus Collection
                  </h1>
                  <span className="text-[8px] sm:text-[10px] tracking-[0.2em] text-[#99793d] uppercase font-semibold block mt-0.5">
                    Jewellers • Belgaum
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <a 
                  href={INSTAGRAM_URL} 
                  target="_blank" 
                  rel="noreferrer"
                  className="bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white p-2 rounded-full shadow-sm hover:opacity-90 flex items-center justify-center transition"
                  title="Instagram"
                >
                  <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                  </svg>
                </a>

                <a 
                  href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Lotus%20Collection,%20I%20am%20interested%20in%20your%20jewellery.`}
                  target="_blank" 
                  rel="noreferrer"
                  className="bg-[#25D366] hover:bg-[#1faa53] text-white px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 shadow-sm transition"
                >
                  <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                  </svg>
                  <span>WhatsApp</span>
                </a>
              </div>
            </div>

            {/* Category Filter */}
            <div className="bg-[#faf6ee] border-t border-b border-stone-200 py-2 px-3 overflow-x-auto no-scrollbar">
              <div className="flex justify-start sm:justify-center items-center gap-6 whitespace-nowrap text-xs font-semibold tracking-wider uppercase text-stone-700">
                {CATEGORIES.map(c => (
                  <button 
                    key={c.name}
                    onClick={() => handleSelectCategory(c.name)}
                    className={`transition pb-0.5 border-b-2 ${selectedCat === c.name && !activeProduct ? 'border-[#5a0017] text-[#5a0017] font-bold' : 'border-transparent text-stone-600 hover:text-[#99793d]'}`}
                  >
                    {c.name}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Body Section */}
          {activeProduct ? (
            <ProductDetailView 
              product={activeProduct} 
              onBack={() => setActiveProduct(null)} 
            />
          ) : (
            <main>
              {/* Dual Carousel Slider */}
              <BannerCarousel banners={banners} />

              {/* Catalogue Grid */}
              <section id="catalogue" className="py-8 bg-white border-t border-stone-200">
                <div className="max-w-6xl mx-auto px-3 sm:px-6">
                  
                  <div className="mb-6 flex justify-between items-end border-b border-stone-200 pb-3">
                    <div>
                      <h2 className="text-xl sm:text-2xl font-serif text-[#5a0017] font-bold uppercase tracking-wider">
                        {selectedCat === "All" ? "Royal 1 Gram Gold Collection" : `${selectedCat} Jewellery`}
                      </h2>
                      <p className="text-[11px] text-stone-500 mt-0.5">Showing {filtered.length} designs available in Shahpur store • Tap any piece to zoom</p>
                    </div>
                  </div>

                  {/* 2-Column Responsive Layout */}
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-3.5 sm:gap-6">
                    {filtered.map(product => (
                      <div 
                        key={product.id} 
                        onClick={() => { setActiveProduct(product); window.scrollTo({top: 0, behavior: 'smooth'}); }}
                        className="group bg-[#faf8f5] border border-stone-200 rounded-xl overflow-hidden flex flex-col cursor-pointer active:scale-95 transition shadow-sm hover:shadow-md"
                      >
                        <div className="relative aspect-square overflow-hidden bg-stone-100 flex items-center justify-center p-1">
                          <img 
                            src={product.image} 
                            alt={product.name} 
                            className="w-full h-full object-contain jewellery-img-render group-hover:scale-105"
                            loading="lazy"
                          />
                          {product.tag && (
                            <span className="absolute top-2 left-2 bg-[#5a0017] text-white text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded shadow">
                              {product.tag}
                            </span>
                          )}
                        </div>

                        <div className="p-3 sm:p-4 flex-1 flex flex-col justify-between">
                          <div>
                            <span className="text-[9px] font-bold uppercase tracking-wider text-[#99793d] block">{product.category}</span>
                            <h3 className="font-serif font-bold text-stone-900 text-xs sm:text-sm mt-0.5 line-clamp-1 group-hover:text-[#5a0017] transition">
                              {product.name}
                            </h3>
                          </div>

                          <div className="mt-3 pt-2.5 border-t border-stone-200 flex items-center justify-between">
                            <div>
                              <div className="text-sm sm:text-base font-bold text-[#5a0017]">
                                {formatPrice(product.price)}
                              </div>
                              {product.originalPrice && (
                                <div className="text-[10px] text-stone-400 line-through">
                                  {formatPrice(product.originalPrice)}
                                </div>
                              )}
                            </div>
                            <span className="text-[10px] font-bold text-[#99793d] group-hover:underline uppercase">
                              View →
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* Footer */}
          <footer className="bg-[#1c1917] text-stone-300 py-8 border-t-2 border-[#99793d] mt-auto">
            <div className="max-w-6xl mx-auto px-4 text-center text-xs space-y-4">
              <div>
                <h4 className="font-serif text-[#f7e6b5] font-bold text-sm tracking-widest uppercase">Lotus Collection Jewellers</h4>
                <p className="text-stone-400 text-[11px] mt-1">{STORE_ADDRESS}</p>
                <p className="text-[#99793d] text-[11px] mt-0.5">Phone: +91 7996957565 / +91 7996953111</p>
              </div>

              <div className="pt-2">
                <a 
                  href={GOOGLE_MAPS_LINK} 
                  target="_blank" 
                  rel="noreferrer"
                  className="inline-block bg-[#99793d] hover:bg-[#b58f4a] text-white text-[11px] font-bold uppercase tracking-wider px-4 py-1.5 rounded transition"
                >
                  📍 Open Store in Google Maps
                </a>
              </div>

              <div className="pt-4 border-t border-stone-800 flex justify-between items-center text-[10px] text-stone-500">
                <span>© {new Date().getFullYear()} Lotus Collection Jewellers</span>
                <button onClick={() => setShowOwnerPortal(true)} className="underline hover:text-stone-300">
                  Owner Portal
                </button>
              </div>
            </div>
          </footer>

          {/* Owner Portal Modal */}
          {showOwnerPortal && (
            <OwnerManagerModal 
              products={products} 
              setProducts={setProducts} 
              banners={banners}
              setBanners={setBanners}
              onClose={() => setShowOwnerPortal(false)} 
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
