    // --- MODAL: HIGH-RES ZOOM & PAN VIEWER ---
    function ImageZoomModal({ product, onClose }) {
      const [scale, setScale] = useState(1);
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      const handleZoomIn = () => setScale(prev => Math.min(prev + 0.5, 4));
      const handleZoomOut = () => {
        setScale(prev => {
          const next = Math.max(prev - 0.5, 1);
          if (next === 1) setPosition({ x: 0, y: 0 });
          return next;
        });
      };
      const handleReset = () => {
        setScale(1);
        setPosition({ x: 0, y: 0 });
      };

      const handleMouseDown = (e) => {
        if (scale > 1) {
          setIsDragging(true);
          dragStart.current = { x: e.clientX - position.x, y: e.clientY - position.y };
        }
      };

      const handleMouseMove = (e) => {
        if (isDragging && scale > 1) {
          setPosition({
            x: e.clientX - dragStart.current.x,
            y: e.clientY - dragStart.current.y
          });
        }
      };

      const handleMouseUp = () => setIsDragging(false);

      return (
        <div 
          className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between p-4 select-none"
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
        >
          {/* Header Controls */}
          <div className="flex justify-between items-center text-white px-2 sm:px-6 pt-2">
            <div>
              <h3 className="font-serif text-lg sm:text-xl font-bold text-[#f7e6b5]">{product.name}</h3>
              <p className="text-xs text-stone-300">{formatPrice(product.price)} • {product.category}</p>
            </div>
            <button 
              onClick={onClose}
              className="bg-stone-800 hover:bg-stone-700 text-white rounded-full p-2.5 px-4 text-sm font-bold flex items-center gap-1 transition"
            >
              ✕ Close
            </button>
          </div>

          {/* Image Canvas */}
          <div 
            className="flex-1 flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing my-2"
            onMouseDown={handleMouseDown}
            onDoubleClick={handleZoomIn}
          >
            <img 
              src={product.image} 
              alt={product.name}
              draggable="false"
              style={{
                transform: `translate(${position.x}px, ${position.y}px) scale(${scale})`,
                transition: isDragging ? 'none' : 'transform 0.2s ease-out'
              }}
              className="max-h-[75vh] max-w-[90vw] object-contain rounded shadow-2xl pointer-events-auto"
            />
          </div>

          {/* Bottom Zoom Control Toolbar */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-stone-900/80 px-6 py-3 rounded-2xl max-w-xl mx-auto border border-stone-700">
            <span className="text-xs text-stone-400">Zoom: {Math.round(scale * 100)}% {scale > 1 ? '(Click & drag to explore)' : '(Double click to zoom)'}</span>
            <div className="flex items-center gap-3">
              <button 
                onClick={handleZoomOut} 
                disabled={scale <= 1}
                className="bg-stone-800 disabled:opacity-40 hover:bg-stone-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold"
              >
                − Zoom Out
              </button>
              <button 
                onClick={handleReset} 
                className="bg-stone-800 hover:bg-stone-700 text-white px-3 py-1.5 rounded-lg text-xs"
              >
                Reset
              </button>
              <button 
                onClick={handleZoomIn}

                className="bg-[#99793d] disabled:opacity-40 hover:bg-[#b58f4a] text-white px-3 py-1.5 rounded-lg text-sm font-bold"
              >
                + Zoom In
              </button>
            </div>
          </div>
        </div>
      );

          price: Number(price),
          originalPrice: originalPrice ? Number(originalPrice) : null,
          category,
          tag,
          description: description || "Handcrafted luxury 1-gram gold jewellery.",
          image: imagePreview

        const updated = [newProduct, ...products];
        setProducts(updated);
        localStorage.setItem("lotus_products", JSON.stringify(updated));

        // Reset fields
        setName("");
        setPrice("");
        setOriginalPrice("");
        setDescription("");
        setImagePreview("");
        alert("✨ Jewellery added successfully to the website!");

              <div>

                <input 
                  type="number"

                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Original Price (₹) (Optional strikethrough)</label>

                  type="number"

                  className="border border-[#f7e6b5] text-[#f7e6b5] px-6 py-3.5 text-xs uppercase tracking-widest font-bold hover:bg-white hover:text-black transition-all"
                >
                  + Add / Update Jewellery
                </button>
              </div>
            </div>
          </section>

          {/* 4. SHOP BY CATEGORY */}
          <section className="py-14 max-w-7xl mx-auto px-4 sm:px-8 w-full">
            <div className="text-center mb-10">
              <h3 className="text-2xl sm:text-3xl font-serif text-[#5a0017] uppercase tracking-wider font-bold">
                Shop By Category
              </h3>
              <div className="w-16 h-0.5 bg-[#99793d] mx-auto mt-2"></div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6">
              {CATEGORIES.map(cat => (
                <div 
                  key={cat.name}
                  onClick={() => { setSelectedCat(cat.name); document.getElementById('catalogue').scrollIntoView({behavior: 'smooth'}); }}
                  className="flex flex-col items-center cursor-pointer group"
                >
                  <div className={`w-28 h-28 sm:w-36 sm:h-36 rounded-full overflow-hidden border-2 p-1 transition-all duration-300 ${selectedCat === cat.name ? 'border-[#5a0017] scale-105 shadow-md' : 'border-stone-300 group-hover:border-[#99793d]'}`}>
                    <img src={cat.img} alt={cat.name} className="w-full h-full object-cover rounded-full group-hover:scale-110 transition-transform duration-500" />
                  </div>
                  <h4 className="mt-3 text-xs sm:text-sm font-semibold tracking-wider uppercase text-stone-800 group-hover:text-[#5a0017]">
                    {cat.name}
                  </h4>
                </div>
              ))}
            </div>
          </section>

          {/* 5. PRODUCT CATALOGUE SECTION WITH ZOOM CLICK */}
          <section id="catalogue" className="py-12 bg-white border-t border-stone-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-8">
              
              <div className="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                <div>
                  <h3 className="text-xl sm:text-2xl font-serif text-[#5a0017] font-bold uppercase tracking-wider">
                    {selectedCat === "All" ? "Curated Jewellery Collection" : `${selectedCat} Collection`}
                  </h3>
                  <p className="text-xs text-stone-500 mt-1">Showing {filtered.length} designs available • Click any picture to zoom</p>
                </div>
                
                {/* Mobile search bar */}
                <div className="w-full sm:w-auto lg:hidden">
                  <input 
                    type="text" 
                    placeholder="Search jewellery..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-stone-100 border border-stone-300 rounded-full px-4 py-2 text-xs"
                  />
                </div>
              </div>

              {/* Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-8">
                {filtered.map(product => (
                  <div key={product.id} className="group bg-[#faf8f5] border border-stone-200 rounded overflow-hidden flex flex-col hover:shadow-xl transition-all duration-300">
                    
                    {/* Clickable Image with Zoom Badge */}
                    <div 
                      onClick={() => setZoomedProduct(product)}
                      className="relative aspect-[4/5] overflow-hidden bg-stone-100 cursor-pointer"
                      title="Click to view full photo and zoom"
                    >
                      <img 
                        src={product.image} 
                        alt={product.name} 
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                      />
                      
                      {/* Zoom Indicator Icon */}
                      <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <span className="bg-black/75 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 backdrop-blur-sm">
                          🔍 Click to Zoom
                        </span>
                      </div>

                      {product.tag && (
                        <span className="absolute top-3 left-3 bg-[#5a0017] text-white text-[10px] uppercase font-bold tracking-widest px-2.5 py-1 rounded shadow">
                          {product.tag}
                        </span>
                      )}
                    </div>

                    {/* Product Details */}
                    <div className="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] font-bold uppercase tracking-widest text-[#99793d]">{product.category}</span>
                        <h4 className="font-serif font-bold text-stone-900 text-base mt-1 group-hover:text-[#5a0017] transition-colors line-clamp-1">
                          {product.name}
                        </h4>
                        <p className="text-xs text-stone-500 mt-1.5 line-clamp-2 leading-relaxed">
                          {product.description}
                        </p>
                      </div>

                      <div className="mt-5 pt-4 border-t border-stone-200 flex items-center justify-between">
                        <div>
                          <div className="text-lg font-bold text-[#5a0017]">{formatPrice(product.price)}</div>
                          {product.originalPrice && (
                            <div className="text-xs text-stone-400 line-through">{formatPrice(product.originalPrice)}</div>
                          )}
                        </div>
                        <a 
                          href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Lotus%20Collection,%20I%20am%20interested%20in%20*${encodeURIComponent(product.name)}*%20(${formatPrice(product.price)}).%20Please%20share%20more%20details.`}
                          target="_blank"
                          rel="noreferrer"
                          className="bg-[#5a0017] text-white hover:bg-[#99793d] px-4 py-2 text-xs uppercase tracking-wider font-semibold rounded transition-colors"
                        >
                          Enquire Now
                        </a>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {filtered.length === 0 && (
                <div className="text-center py-16 text-stone-500">
                  <p className="text-lg font-serif">No jewellery found matching your search.</p>
                </div>
              )}
            </div>
          </section>

          {/* 6. INSTAGRAM & SOCIAL SECTION */}
          <section className="py-14 bg-[#faf6ee] border-t border-stone-200 text-center px-4">
            <div className="max-w-4xl mx-auto">
              <span className="text-xs font-bold tracking-[0.3em] uppercase text-[#99793d]">Connect With Us</span>
              <h3 className="text-2xl sm:text-3xl font-serif font-bold text-[#5a0017] mt-1 mb-3">
                Follow Us On Instagram
              </h3>
              <p className="text-xs sm:text-sm text-stone-600 mb-6 max-w-lg mx-auto">
                Explore real bridal videos, daily new arrivals, customer showcases, and behind-the-scenes on our official Instagram page.
              </p>
              <a 
                href={INSTAGRAM_URL}
                target="_blank"
                rel="noreferrer"
                className="inline-flex items-center gap-2 bg-gradient-to-r from-purple-600 via-pink-600 to-orange-500 text-white font-bold text-xs uppercase tracking-widest px-6 py-3 rounded-full shadow hover:opacity-90 transition-opacity"
              >
                <span>Visit @{INSTAGRAM_HANDLE}</span>
              </a>
            </div>
          </section>

          {/* 7. TRUST PROMISES */}
          <section className="py-10 bg-white border-t border-stone-200">
            <div className="max-w-6xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-6 text-center text-xs">
              <div className="p-4">
                <div className="text-2xl mb-2">💎</div>
                <h5 className="font-bold text-stone-800 uppercase tracking-wider mb-1">1 Gram Gold Polish</h5>
                <p className="text-stone-500">Premium long-lasting shine & high-grade finishing</p>
              </div>
              <div className="p-4">
                <div className="text-2xl mb-2">✨</div>
                <h5 className="font-bold text-stone-800 uppercase tracking-wider mb-1">Authentic Designs</h5>
                <p className="text-stone-500">Handpicked South Indian temple & bridal pieces</p>
              </div>
              <div className="p-4">
                <div className="text-2xl mb-2">📦</div>
                <h5 className="font-bold text-stone-800 uppercase tracking-wider mb-1">Safe Shipping</h5>
                <p className="text-stone-500">Carefully packaged and delivered to your doorstep</p>
              </div>
              <div className="p-4">
                <div className="text-2xl mb-2">🏪</div>
                <h5 className="font-bold text-stone-800 uppercase tracking-wider mb-1">Store In Belgaum</h5>
                <p className="text-stone-500">Visit our physical shop in Shahpur for trials</p>
              </div>
            </div>
          </section>

          {/* 8. FOOTER */}
          <footer className="bg-[#1c1917] text-stone-300 pt-14 pb-8 border-t-2 border-[#99793d] mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-8 grid grid-cols-1 md:grid-cols-3 gap-10 pb-12 border-b border-stone-800">
              
              <div>
                <h4 className="text-lg font-serif text-[#f7e6b5] font-bold tracking-widest uppercase mb-3">Lotus Collection</h4>
                <p className="text-xs text-stone-400 leading-relaxed mb-4">
                  Bolmaal Galli Corner, Khade Bazar, Shahpur, Belgaum, Karnataka, India. Offering top-quality bridal, American diamond, and temple jewellery.
                </p>
                <div className="text-xs text-[#99793d] font-semibold">
                  Phone: +91 7996957565 / +91 7996953111
                </div>
              </div>

              <div>
                <h4 className="text-xs font-bold text-white uppercase tracking-widest mb-4">Quick Links</h4>
                <ul className="space-y-2 text-xs text-stone-400">
                  <li><button onClick={() => { setSelectedCat("All"); window.scrollTo({top:0, behavior:'smooth'}); }} className="hover:text-white">All Jewellery</button></li>
                  <li><button onClick={() => { setSelectedCat("Bridal"); document.getElementById('catalogue').scrollIntoView({behavior:'smooth'}); }} className="hover:text-white">Bridal Sets</button></li>
                  <li><button onClick={() => { setSelectedCat("Earrings"); document.getElementById('catalogue').scrollIntoView({behavior:'smooth'}); }} className="hover:text-white">Antique Jhumkas</button></li>
                  <li><button onClick={() => setShowManager(true)} className="hover:text-white underline">Admin: Add Photos & Prices</button></li>
                </ul>
              </div>

              <div>
                <h4 className="text-xs font-bold text-white uppercase tracking-widest mb-4">Store Location</h4>
                <p className="text-xs text-stone-400 mb-3">{STORE_ADDRESS}</p>
                <a 
                  href={GOOGLE_MAPS_LINK} 
                  target="_blank" 
                  rel="noreferrer"
                  className="inline-block bg-[#99793d] text-white text-xs font-bold uppercase tracking-widest px-4 py-2 hover:bg-[#b58f4a] transition-colors"
                >
                  Open in Google Maps
                </a>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-8 pt-6 flex flex-col sm:flex-row justify-between items-center text-[11px] text-stone-500">
              <p>&copy; {new Date().getFullYear()} Lotus Collection Jewellers. All rights reserved.</p>
              <p className="mt-2 sm:mt-0">Shahpur, Belgaum</p>
            </div>
          </footer>

          {/* Floating WhatsApp CTA */}
          <a 
            href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Lotus%20Collection,%20I%20am%20interested%20in%20your%20jewellery.`}
            target="_blank" 
            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-[#25D366] text-white p-3.5 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center"
            title="Chat on WhatsApp"
          >
            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
          </a>

          {/* Full Screen Image Zoom Viewer Modal */}
          {zoomedProduct && (
            <ImageZoomModal 
              product={zoomedProduct} 
              onClose={() => setZoomedProduct(null)} 
            />
          )}

          {/* Product Manager Panel Modal */}
          {showManager && (
            <ProductManager 
              products={products} 
              setProducts={setProducts} 
              onClose={() => setShowManager(false)} 
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
