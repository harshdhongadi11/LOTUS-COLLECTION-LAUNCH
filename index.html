    // --- DEDICATED PRODUCT DETAILS VIEW ---
    function ProductDetailView({ product, onBack }) {
      const [isZoomed, setIsZoomed] = useState(false);
      const [mousePos, setMousePos] = useState({ x: 50, y: 50 });

      const handleMouseMove = (e) => {
        const { left, top, width, height } = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - left) / width) * 100;
        const y = ((e.clientY - top) / height) * 100;
        setMousePos({ x, y });
      };

      return (
        <main className="max-w-6xl mx-auto px-4 sm:px-8 py-10">

            onClick={onBack}
            className="inline-flex items-center gap-2 text-xs uppercase tracking-widest font-bold text-stone-600 hover:text-[#5a0017] mb-8 bg-white border border-stone-200 px-4 py-2 rounded-full shadow-sm hover:shadow transition"

    // --- PROTECTED OWNER-ONLY ADMIN PORTAL ---
    function OwnerManagerModal({ products, setProducts, banner, setBanner, onClose }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [enteredPin, setEnteredPin] = useState("");
      const [pinError, setPinError] = useState(false);
      const [activeTab, setActiveTab] = useState("products"); // 'products' or 'banner'

      // Product Form State
      const [name, setName] = useState("");
      const [price, setPrice] = useState("");
      const [originalPrice, setOriginalPrice] = useState("");
      const [category, setCategory] = useState("Necklaces");
      const [tag, setTag] = useState("New Arrival");
      const [description, setDescription] = useState("");
      const [imagePreview, setImagePreview] = useState("");

      // Banner Form State
      const [bannerSubtitle, setBannerSubtitle] = useState(banner.subtitle);
      const [bannerTitle, setBannerTitle] = useState(banner.title);
      const [bannerDesc, setBannerDesc] = useState(banner.description);
      const [bannerMediaUrl, setBannerMediaUrl] = useState(banner.mediaUrl);
      const [bannerMediaType, setBannerMediaType] = useState(banner.mediaType);

      const handleLogin = (e) => {
        e.preventDefault();
        if (enteredPin === OWNER_PIN) {
          setIsAuthenticated(true);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setImagePreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleBannerMediaUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const isVideo = file.type.startsWith("video");
          const reader = new FileReader();
          reader.onloadend = () => {
            setBannerMediaUrl(reader.result);
            setBannerMediaType(isVideo ? "video" : "image");
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveBanner = (e) => {
        e.preventDefault();
        const updated = {
          subtitle: bannerSubtitle,
          title: bannerTitle,
          description: bannerDesc,
          mediaType: bannerMediaType,
          mediaUrl: bannerMediaUrl
        };
        setBanner(updated);
        localStorage.setItem("lotus_banner", JSON.stringify(updated));
        alert("✨ Banner details updated successfully!");
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!name || !price || !imagePreview) {
          alert("Please provide the Product Name, Price, and an Image!");
          return;
        }

        const newProduct = {
          id: Date.now(),
          name,
          price: Number(price),
          originalPrice: originalPrice ? Number(originalPrice) : null,
          category,
          tag,
          description: description || "Handcrafted luxury 1-gram gold jewellery.",
          image: imagePreview
        };

        const updated = [newProduct, ...products];
        setProducts(updated);
        localStorage.setItem("lotus_products", JSON.stringify(updated));

        setName("");
        setPrice("");
        setOriginalPrice("");
        setDescription("");
        setImagePreview("");
        alert("✨ New jewellery published successfully to the store!");
      };

      const handleDelete = (id) => {
        if (confirm("Are you sure you want to remove this jewellery item?")) {
          const updated = products.filter(p => p.id !== id);
          setProducts(updated);
          localStorage.setItem("lotus_products", JSON.stringify(updated));
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-center items-center p-4">
          <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[92vh] overflow-y-auto shadow-2xl border border-stone-200 p-6 sm:p-8">
            <div className="flex justify-between items-center border-b pb-4 mb-6">
              <div>
                <h2 className="text-xl font-bold font-serif text-[#5a0017]">Owner Control Portal</h2>
                <p className="text-xs text-stone-500">Manage jewellery photographs, banner animation, and rates.</p>
              </div>
              <button 
                onClick={onClose} 
                className="bg-stone-100 hover:bg-stone-200 text-stone-800 px-3 py-1.5 rounded-full text-xs font-bold"
              >
                ✕ Close
              </button>
            </div>

            {!isAuthenticated ? (
              <form onSubmit={handleLogin} className="max-w-sm mx-auto py-8 text-center">
                <div className="w-12 h-12 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center mx-auto mb-4 text-xl font-bold">
                  🔒
                </div>
                <h3 className="font-serif text-lg font-bold text-stone-800 mb-1">Enter Owner Passcode</h3>
                <p className="text-xs text-stone-500 mb-4">Please type your PIN to unlock.</p>
                <input 
                  type="password"
                  placeholder="••••••••"
                  value={enteredPin}
                  onChange={(e) => setEnteredPin(e.target.value)}
                  className="w-full text-center tracking-widest text-lg font-bold p-3 border rounded-xl outline-none focus:border-[#5a0017] mb-3"
                  autoFocus
                />
                {pinError && <p className="text-xs text-red-600 mb-3">Incorrect passcode. Please try again.</p>}
                <button 
                  type="submit"
                  className="w-full bg-[#5a0017] hover:bg-[#78001f] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-wider"
                >
                  Unlock Portal
                </button>
              </form>
            ) : (
              <div>
                {/* Tabs */}
                <div className="flex border-b border-stone-200 mb-6 gap-6 text-xs font-bold uppercase tracking-wider">
                  <button 
                    onClick={() => setActiveTab("products")}
                    className={`pb-2.5 transition-colors border-b-2 ${activeTab === 'products' ? 'border-[#5a0017] text-[#5a0017]' : 'border-transparent text-stone-500 hover:text-stone-800'}`}
                  >
                    💎 Jewellery Inventory
                  </button>
                  <button 
                    onClick={() => setActiveTab("banner")}
                    className={`pb-2.5 transition-colors border-b-2 ${activeTab === 'banner' ? 'border-[#5a0017] text-[#5a0017]' : 'border-transparent text-stone-500 hover:text-stone-800'}`}
                  >
                    🎬 Hero Banner & Animation
                  </button>
                </div>

                {activeTab === "products" ? (
                  <div>
                    <form onSubmit={handleAddProduct} className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#faf8f5] p-5 rounded-xl border border-stone-200">
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Jewellery Name</label>
                        <input 
                          type="text" 
                          placeholder="e.g. Royal South Indian Bridal Choker"
                          value={name} 
                          onChange={e => setName(e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]" 
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Selling Price (₹)</label>
                        <input 
                          type="number" 
                          placeholder="e.g. 4500"
                          value={price} 
                          onChange={e => setPrice(e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]" 
                          required
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Original Price (₹) (Optional strikethrough)</label>
                        <input 
                          type="number" 
                          placeholder="e.g. 6000"
                          value={originalPrice} 
                          onChange={e => setOriginalPrice(e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]" 
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Category</label>
                        <select 
                          value={category} 
                          onChange={e => setCategory(e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]"
                        >
                          <option value="Necklaces">Necklaces</option>
                          <option value="Earrings">Earrings</option>
                          <option value="Bangles">Bangles</option>
                          <option value="Bridal">Bridal</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Tag (Badge)</label>
                        <input 
                          type="text" 
                          placeholder="e.g. Bestseller, New Arrival, Trending"
                          value={tag} 
                          onChange={e => setTag(e.target.value)}
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]" 
                        />
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">Description</label>
                        <textarea 
                          placeholder="Write brief details about the stones, polish, or craftsmanship..."
                          value={description} 
                          onChange={e => setDescription(e.target.value)}
                          rows="2"
                          className="w-full bg-white border border-stone-300 rounded-lg p-2.5 text-xs outline-none focus:border-[#99793d]" 
                        />
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1">
                          Choose Photo (Direct from Phone or Computer)
                        </label>
                        <input 
                          type="file" 
                          accept="image/*"
                          onChange={handleImageUpload}
                          className="w-full bg-white border border-dashed border-stone-300 rounded-lg p-3 text-xs" 
                        />
                        {imagePreview && (
                          <div className="mt-3 flex items-center gap-3">
                            <img src={imagePreview} alt="Preview" className="w-16 h-16 object-cover rounded border" />
                            <span className="text-xs text-green-700 font-semibold">✓ Photo attached!</span>
                          </div>
                        )}
                      </div>

                      <div className="sm:col-span-2 pt-2">
                        <button 
                          type="submit" 
                          className="w-full bg-[#5a0017] hover:bg-[#78001f] text-white font-bold py-3 rounded-lg text-xs uppercase tracking-widest transition shadow"
                        >
                          ➕ Upload & Publish Jewellery
                        </button>

                          setBannerMediaUrl(e.target.value);

              </div>
            )}
          </div>
        </div>
      );
    }

          )}

          {/* 8. FOOTER */}
          <footer className="bg-[#1c1917] text-stone-300 pt-14 pb-8 border-t-2 border-[#99793d] mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-8 grid grid-cols-1 md:grid-cols-3 gap-10 pb-12 border-b border-stone-800">
              <div>
                <h4 className="text-lg font-serif text-[#f7e6b5] font-bold tracking-widest uppercase mb-3">Lotus Collection</h4>
                <p className="text-xs text-stone-400 leading-relaxed mb-4">
                  Bolmaal Galli Corner, Khade Bazar, Shahpur, Belgaum, Karnataka, India. Offering top-quality bridal, American diamond, and temple jewellery.
                </p>
                <div className="text-xs text-[#99793d] font-semibold">
                  Phone: +91 7996957565 / +91 7996953111
                </div>
              </div>

              <div>
                <h4 className="text-xs font-bold text-white uppercase tracking-widest mb-4">Quick Links</h4>
                <ul className="space-y-2 text-xs text-stone-400">
                  <li><button onClick={() => { setActiveProduct(null); setSelectedCat("All"); window.scrollTo({top:0, behavior:'smooth'}); }} className="hover:text-white">All Jewellery</button></li>
                  <li><button onClick={() => handleSelectCategory("Bridal")} className="hover:text-white">Bridal Sets</button></li>
                  <li><button onClick={() => handleSelectCategory("Earrings")} className="hover:text-white">Antique Jhumkas</button></li>
                  <li><a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" className="hover:text-white">Instagram Profile</a></li>
                </ul>
              </div>

              <div>
                <h4 className="text-xs font-bold text-white uppercase tracking-widest mb-4">Store Location</h4>
                <p className="text-xs text-stone-400 mb-3">{STORE_ADDRESS}</p>
                <a 
                  href={GOOGLE_MAPS_LINK} 
                  target="_blank" 
                  rel="noreferrer"
                  className="inline-block bg-[#99793d] text-white text-xs font-bold uppercase tracking-widest px-4 py-2 hover:bg-[#b58f4a] transition-colors"
                >
                  Open in Google Maps
                </a>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-8 pt-6 flex flex-col sm:flex-row justify-between items-center text-[11px] text-stone-500">
              <p>&copy; {new Date().getFullYear()} Lotus Collection Jewellers. All rights reserved.</p>
              
              <div className="flex items-center gap-4 mt-2 sm:mt-0">
                <span>Shahpur, Belgaum</span>
                <span>•</span>
                <button 
                  onClick={() => setShowOwnerPortal(true)} 
                  className="text-stone-600 hover:text-stone-400 underline transition cursor-pointer"
                >
                  Owner Portal
                </button>
              </div>
            </div>
          </footer>

          {/* Floating WhatsApp CTA */}
          <a 
            href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Lotus%20Collection,%20I%20am%20interested%20in%20your%20jewellery.`}

            rel="noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-[#25D366] text-white p-3.5 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center"
            title="Chat on WhatsApp"
          >
            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
          </a>

          {/* Owner Portal Modal */}
          {showOwnerPortal && (
            <OwnerManagerModal 
              products={products} 
              setProducts={setProducts} 
              banner={banner}
              setBanner={setBanner}
              onClose={() => setShowOwnerPortal(false)} 
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
